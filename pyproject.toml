[project]
name = "ontara"
version = "0.1.0"
description = "Governed supply chain intelligence built on Snowflake AI Data Cloud."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Rahul Ranjan" }
]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false